<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Kakao Map Test</title>
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=b2172a175743beeac393facc09b5e62f&autoload=false"></script>
</head>
<body>
  <h3>Kakao Map Direct Test</h3>
  <div id="kakaoMap" style="width:800px;height:500px;border:2px solid red;"></div>
  <div id="status">Loading...</div>
  <script>
    kakao.maps.load(function() {
      document.getElementById('status').textContent = 'SDK loaded, creating map...';
      var container = document.getElementById('kakaoMap');
      var options = {
        center: new kakao.maps.LatLng(37.7991, 127.6188),
        level: 5,
        mapTypeId: kakao.maps.MapTypeId.HYBRID
      };
      var map = new kakao.maps.Map(container, options);
      document.getElementById('status').textContent = 'Map created! If you see the map above, Kakao is working.';
    });
  </script>
</body>
</html>
